name: Test Pitwall Backend

on:
  push:
    branches: [ "main", "master", "adk" ]
  pull_request:
    branches: [ "main", "master", "adk" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    # `dev` / `can` extras live on the edge-daemon (pitwall) member, not the
    # workspace-root umbrella — scope the sync to that package.
    - name: Install dependencies
      run: uv sync --package edge-daemon --extra dev --extra can

    # edge-daemon's pytest config (testpaths, pythonpath) is relative to its
    # own dir, so run from there.
    - name: Run tests with pytest
      run: uv run --package edge-daemon pytest
      working-directory: apps/edge-daemon
