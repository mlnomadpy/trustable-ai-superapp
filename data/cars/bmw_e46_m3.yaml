# 2003 BMW M3 (E46) — AiM MXP SmartyCam port → CANable 2.0 → Pixel 10
#
# Source spec: .context/CANable2_Pixel10_Developer_Integration_Spec_v3.0.pdf
# Live capture cross-check: .context/can_report.txt
#
# This config does NOT describe native BMW PT-CAN. The Pixel 10 never
# touches the BMW bus directly. The AiM MXP dash logger sits in the
# middle: it ingests BMW DME/DSC (CANBUS1) + TrailBrake TPMS (CANBUS2)
# and re-broadcasts a fixed protocol on its SmartyCam output port. The
# Jhoinrch RH-02 PRO (CANable 2.0) listens to that output bus and
# forwards frames as ASCII SLCAN over USB-C OTG.
#
# On-bus frame layouts live in data/dbc/pitwall.dbc. This YAML captures
# the wrapping facts the DBC can't express: wiring, bitrate, USB
# transport, broadcast rates, sign-recovery rules, known-broken
# channels, and live-validated discrepancies vs the PDF.

car:
  make: BMW
  model: M3
  chassis: E46
  year: 2003
  engine: S54B32 (MSS54HP DME)
  notes: >
    Gear position is not exposed by MSS54HP on any diagnostic path. The
    MXP slots at 0x420 bytes 4-5 and 0x450 bytes 2-3 read either 0 or
    0xCFFE padding (PDF says 0; live capture shows 0xCFFE). Coaches
    must derive gear from RPM / wheel-speed ratio (see methods.gear_position).

# --- 1. Dash logger (the bus master) -------------------------------------
dash_logger:
  make: AiM
  model: MXP
  output_port: SmartyCam
  protocol: AIM MXP SmartyCam Enhanced CAN Protocol v3.0
  software: RaceStudio3 v3.83.00
  total_frames: 20             # 5 std (0x420-0x424) + 15 extended (0x450-0x45E)
  total_channels: 66           # 19 std + 47 extended per PDF v3.0 §1
  input_sources:
    canbus1: "BMW DME / DSC (BMW_MINI protocol, 500 Kbit/s, receive only)"
    canbus2: "TrailBrake TPMS v1 (1 Mbit/s, receive only, ID 0x18FEF433 29-bit extended)"
    internal: "AiM GPS09c 25 Hz puck + MXP 9-axis IMU (100 Hz hw, 50 Hz CAN) + analog sensors"

# --- 2. Wiring: MXP SmartyCam port → CANable 2.0 -------------------------
# Cable: AiM RLCAB015L (4-wire) — only CAN H / CAN L are landed.
wiring:
  cable: RLCAB015L
  conductors:
    blue:  { lands_on: CAN_H, terminal: "RH-02 PRO CAN H" }
    white: { lands_on: CAN_L, terminal: "RH-02 PRO CAN L" }
    gnd:   { lands_on: unconnected, reason: "RH-02 PRO is galvanically isolated" }
    "5v":  { lands_on: unconnected, reason: "5V terminal is an adapter OUTPUT, not required" }
  termination:
    mxp_internal_120R: enabled         # MXP SmartyCam internal terminator ON
    canable_switch_120R: enabled       # RH-02 PRO termination switch ON
    topology: "two nodes, one 120 Ω resistor at each end of the pair"
  downstream:
    smartycam_y_split:
      - { device: "RaceLogic VBOX HD2", role: "video logger, own internal GPS, receive-only" }
      - { device: "Jhoinrch RH-02 PRO (CANable 2.0)", role: "SLCAN bridge to Pixel 10" }

# --- 3. CAN bus electrical/timing ----------------------------------------
can_bus:
  name: AiM MXP SmartyCam Output
  bitrate_bps: 1000000           # 1 Mbit/s — NOT 500 kbps
  frame_format: classic_can      # not CAN-FD
  id_width: 11                   # 11-bit standard IDs only ("t" frames in SLCAN, never "T")
  byte_order: little_endian      # byte 0 = LSB on every multi-byte channel
  dlc: 8                         # every frame in this protocol is 8 bytes

# --- 4. USB transport: CANable 2.0 → Pixel 10 ----------------------------
usb_adapter:
  make: Jhoinrch
  model: RH-02 PRO
  alias: CANable 2.0
  firmware: SLCAN
  usb_class: CDC                 # appears as a virtual serial port
  android_library: "com.github.mik3y:usb-serial-for-android:3.4.6"
  port_settings: { baud: 115200, data_bits: 8, stop_bits: 1, parity: none }
  slcan_frame_format:
    template: "t<ID:3hex><DLC:1><DATA:16hex>\\r"
    terminator: "\\r"            # carriage return, 0x0D
    standard_prefix: "t"         # lowercase = 11-bit standard
    extended_prefix: "T"         # uppercase = 29-bit; NOT used on the SmartyCam stream
    example: "t42081A2B3C4D5E6F7A8B\\r"
  open_sequence:                 # what python-can / slcand sends on attach
    - { cmd: "C\\r",  meaning: "close (idempotent reset)" }
    - { cmd: "S8\\r", meaning: "set bitrate 1 Mbit/s" }
    - { cmd: "O\\r",  meaning: "open channel (start reading)" }

# --- 5. python-can configuration ----------------------------------------
python_can:
  interface: slcan
  channel: /dev/ttyACM0          # CDC device node on Linux/Termux; varies per host
  bitrate: 1000000
  ttyBaudrate: 115200

# --- 6. Frame summary (matches data/dbc/pitwall.dbc v3.0) ----------------
# Rate is set per CAN ID, not per channel — slow channels (oil filter temp
# 1 Hz, fuel 10 Hz) repeat values when packed inside faster frames.
# `observed_hz` is from .context/can_report.txt (8 s engine-off capture).
frames:
  # ── Standard SmartyCam stream — cosmetic 16 Hz mirror (live-confirmed) ──
  0x420:
    dbc_message: SmartyCam01
    rate_hz: 10                  # PDF nominal
    observed_hz: 16              # live capture
    role: cosmetic_mirror
    channels: [rpm, gps_speed_mph, gear, water_temp_f]
    note: "Mirror of 0x450. Live capture shows ~16 Hz, not the 10 Hz PDF claims."
  0x421:
    dbc_message: SmartyCam02
    rate_hz: 50
    observed_hz: 16
    role: cosmetic_mirror
    channels: [water_press_psi, roll_rate_degs_std, oil_filter_temp_f_std, oil_press_psi_std]
    note: "IMU rate slot returns 0xCFFE padding — use 0x456. Pressures mirror 0x457/0x458."
  0x422:
    dbc_message: SmartyCam03
    rate_hz: 50
    observed_hz: 16
    role: cosmetic_mirror
    channels: [brake_press_psi_std, throttle_pos_pct_std, brake_switch_std, pitch_rate_degs_std]
    note: "IMU rate slot returns 0xCFFE padding — use 0x456. Pedal/brake mirror 0x452/0x453."
  0x423:
    dbc_message: SmartyCam04
    rate_hz: 50
    observed_hz: 16
    role: authoritative_partial  # steer_angle_deg lives only here in standard stream
    channels: [steer_angle_deg, yaw_rate_degs_std, lateral_accel_g_std, inline_accel_g_std]
    note: "IMU slots return 0xCFFE — use 0x455/0x456. Only steer_angle_deg is real here."
  0x424:
    dbc_message: SmartyCam05
    rate_hz: 50
    observed_hz: 16
    role: authoritative_partial  # battery_volt lives only here in standard stream
    channels: [fuel_level_gal_std, battery_volt, vertical_accel_g_std]
    note: "Vert-accel slot returns 0xCFFE — use 0x455. Fuel mirrors 0x453. Battery is authoritative."

  # ── Extended ECU stream (10 Hz) ─────────────────────────────────────────
  0x450:
    dbc_message: AimExtended01_ECU1
    rate_hz: 10
    observed_hz: 10
    role: authoritative
    channels: [rpm_ext, gear_ext, speed_mph_ext, water_temp_f_ext]
  0x451:
    dbc_message: AimExtended02_WheelSpeeds
    rate_hz: 10
    observed_hz: 10
    role: authoritative
    channels: [wheel_speed_fl_mph, wheel_speed_fr_mph, wheel_speed_rl_mph, wheel_speed_rr_mph]
    source: BMW_DSC
  0x452:
    dbc_message: AimExtended03_ECU3
    rate_hz: 10
    observed_hz: 10
    role: authoritative
    channels: [engine_oil_temp_f, ambient_temp_f, steer_angle_deg_ext, pedal_pos_pct]
  0x453:
    dbc_message: AimExtended04_StatusFlags
    rate_hz: 10
    observed_hz: 10
    role: authoritative
    channels: [fuel_level_gal, abs_fail, dsc_reg, brake_switch]
  0x454:
    dbc_message: AimExtended05_MIL
    rate_hz: 10
    observed_hz: 10
    role: authoritative
    channels: [mil_chk_eng]

  # ── Extended IMU stream (50 Hz) ─────────────────────────────────────────
  0x455:
    dbc_message: AimExtended06_Accel
    rate_hz: 50
    observed_hz: 50
    role: authoritative
    channels: [inline_accel_g, lateral_accel_g, vertical_accel_g]
  0x456:
    dbc_message: AimExtended07_Gyro
    rate_hz: 50
    observed_hz: 50
    role: authoritative
    channels: [roll_rate_degs, pitch_rate_degs, yaw_rate_degs]

  # ── Extended analog sensors ─────────────────────────────────────────────
  0x457:
    dbc_message: AimExtended08_Analog20
    rate_hz: 20
    observed_hz: 20
    role: authoritative
    channels: [oil_press_psi, water_press_psi_an, fuel_press_psi, brake_press_psi]
  0x458:
    dbc_message: AimExtended09_Analog1
    rate_hz: 1
    observed_hz: 1
    role: authoritative
    channels: [oil_filter_temp_f, luminosity_pct, logger_temp_f]

  # ── GPS (20 Hz; GPS09c hw samples at 25 Hz) ─────────────────────────────
  0x459:
    dbc_message: AimExtended10_GPS
    rate_hz: 20
    observed_hz: 20
    role: authoritative
    channels: [gps_lat, gps_lon]
    note: "4-byte signed int32_le, deg×1e7. Live: lat valid, lon=0x7FFFFFFF sentinel until full fix."

  # ── TPMS (10 Hz pressures/temps/volts, 1 Hz alarms) ─────────────────────
  0x45A:
    dbc_message: AimExtended11_TpmsPress
    rate_hz: 10
    observed_hz: 10
    role: authoritative
    channels: [tpms_press_fl_psi, tpms_press_fr_psi, tpms_press_rl_psi, tpms_press_rr_psi]
    source: TrailBrake_TPMS_v1
  0x45B:
    dbc_message: AimExtended12_TpmsTemp
    rate_hz: 10
    observed_hz: 10
    role: authoritative
    channels: [tpms_temp_fl_f, tpms_temp_fr_f, tpms_temp_rl_f, tpms_temp_rr_f]
    source: TrailBrake_TPMS_v1
  0x45C:
    dbc_message: AimExtended13_TpmsVolt
    rate_hz: 10
    observed_hz: 10
    role: authoritative
    channels: [tpms_volt_fl_mv, tpms_volt_fr_mv, tpms_volt_rl_mv, tpms_volt_rr_mv]
    source: TrailBrake_TPMS_v1
  0x45D:
    dbc_message: AimExtended14_TpmsAlm
    rate_hz: 1                   # hardware limit (alarm RF governs all four)
    observed_hz: 1
    role: authoritative
    channels: [tpms_alm_fl, tpms_alm_fr, tpms_alm_rl, tpms_alm_rr]
    source: TrailBrake_TPMS_v1
    note: "Bitfield per channel: bit0=air leak, bit4=low temp, bit5=sensor fail. 0=no alarm."

  # ── GPS Supplemental (20 Hz) ────────────────────────────────────────────
  0x45E:
    dbc_message: AimExtended15_GpsSuppl
    rate_hz: 20
    observed_hz: 20
    role: authoritative
    channels: [gps_speed_mph, gps_altitude_m, gps_pos_acc_mm, gps_speed_acc_mph]
    note: "altitude=65535 and speed_acc unrealistic = no full GPS fix yet."

# --- 7. Signed channels --------------------------------------------------
# Declared `@1-` in pitwall.dbc, so cantools decodes them correctly.
# Listed here for the sign-convention audit the PDF (§8.2) requires on
# first capture. If a channel reads large-positive where negative is
# expected, set `apply: [{sign_flip: true}]` in the signals: pipeline.
signed_channels_first_capture_verify:
  - { channel: roll_rate_degs,    positive: roll right,        negative: roll left,            frame: 0x456 }
  - { channel: pitch_rate_degs,   positive: nose up,           negative: nose down,            frame: 0x456 }
  - { channel: yaw_rate_degs,     positive: rotate right CW,   negative: rotate left,          frame: 0x456 }
  - { channel: lateral_accel_g,   positive: cornering right,   negative: cornering left,       frame: 0x455 }
  - { channel: inline_accel_g,    positive: acceleration,      negative: braking,              frame: 0x455 }
  - { channel: vertical_accel_g,  positive: bump (upward),     negative: rebound (downward),   frame: 0x455 }
  - { channel: steer_angle_deg,   positive: right of centre,   negative: left of centre,       frame: 0x423/0x452 }

# --- 8. Known-broken / derived channels ----------------------------------
# Per PDF §12. Coaches must not gate on these unless derived.
known_constraints:
  gear:
    on_bus: "0x420 bytes 4-5 and 0x450 bytes 2-3"
    status: padding_only
    raw_observed: "0xCFFE (signed-cast = -12290; unsigned = 53246)"
    pdf_says: "always 0"
    reason: "MSS54HP DME does not transmit gear on any diagnostic path"
    derived_replacement:
      method: rpm_over_wheel_speed_ratio
      handler_key: gear_position
      inputs: [rpm, wheel_speed_rl_mph, wheel_speed_rr_mph]
      ratios:                        # S54 ZF S6S420G + 3.62 final drive
        "1": 4.227
        "2": 2.528
        "3": 1.669
        "4": 1.226
        "5": 1.000
        "6": 0.828
      final_drive: 3.62
      tire_circumference_m: 1.998    # 245/40 R18 rear, stock
  oil_filter_temp_f:
    role: primary oil health (PT-100 at filter housing)
    caveat: "Slow thermal response — don't use for rapid transient events"
  engine_oil_temp_f:
    role: secondary reference (DME sump sensor)
    caveat: "Lags real oil operating temperature significantly"
  oil_press_psi:
    on_bus: "0x457 bytes 0-1 (primary), 0x421 bytes 6-7 (mirror)"
    sentinel: "0xFFFF → 6553.5 psi after scale = engine off / no reading"
  battery_volt:
    caveat: "scale × 0.1 V confirmed; verify range on first engine-running capture (PDF §12)"
  gps_lon:
    sentinel: "0x7FFFFFFF → +214.7483647° = no longitude fix yet (lat may be valid before lon)"
  gps_altitude_m:
    sentinel: "65535 m = no altitude fix"
  standard_stream_imu_slots:
    on_bus: "0x421 bytes 2-3, 0x422 bytes 6-7, 0x423 bytes 2-7, 0x424 bytes 4-5"
    status: always_padding
    raw_observed: "0xCFFE"
    pdf_says: "valid IMU data (cosmetic slot labels per §5)"
    workaround: "Use 0x455 (Accel) and 0x456 (Gyro) extended frames. DBC suffixes std slots as _std for clarity."

# --- 9. CAN ID collision registry (PDF §11) ------------------------------
# Verified by AiM: zero collisions across the MXP's three buses.
# Live capture (.context/can_report.txt) found additional undocumented IDs
# leaking through to the SmartyCam port — see undocumented_passthrough below.
collision_registry:
  - { ids: "0x420-0x424",         bus: "SmartyCam port",   owner: "AiM MXP",       purpose: "Standard SmartyCam stream — RPM, speed, IMU slots, temps, pressures" }
  - { ids: "0x450-0x454",         bus: "SmartyCam port",   owner: "AiM MXP",       purpose: "Extended ECU blocks 1-5" }
  - { ids: "0x455-0x456",         bus: "SmartyCam port",   owner: "AiM MXP",       purpose: "Extended IMU — accelerometers and gyroscopes (50 Hz)" }
  - { ids: "0x457-0x458",         bus: "SmartyCam port",   owner: "AiM MXP",       purpose: "Extended analog sensors (20 Hz and 1 Hz groups)" }
  - { ids: "0x459",               bus: "SmartyCam port",   owner: "AiM MXP",       purpose: "GPS Lat/Lon from GPS09c puck" }
  - { ids: "0x45A-0x45D",         bus: "SmartyCam port",   owner: "AiM MXP",       purpose: "TPMS pressure, temp, voltage, alarm (TrailBrake source)" }
  - { ids: "0x45E",               bus: "SmartyCam port",   owner: "AiM MXP",       purpose: "GPS Speed, Altitude, Pos Accuracy, Speed Accuracy" }
  - { ids: "0x45F-0x4FF",         bus: "SmartyCam port",   owner: "RESERVED",      purpose: "Available for future expansion" }
  - { ids: "BMW DME/DSC IDs",     bus: "CANBUS1 (rx)",     owner: "BMW",           purpose: "Engine/chassis input to MXP. PDF says NOT retransmitted; live capture sees leakage — see undocumented_passthrough" }
  - { ids: "0x18FEF433",          bus: "CANBUS2 (rx)",     owner: "TrailBrake",    purpose: "29-bit extended TPMS source. NOT retransmitted on SmartyCam port (physically isolated, 11-bit only)" }

# Live-observed IDs not documented in the PDF v3.0. These appear on the
# SmartyCam port despite PDF §11 claiming CANBUS1 traffic isn't retransmitted.
# At ~38 % of bus volume in the live capture. Pitwall ignores them (no DBC
# decode) but they consume bus bandwidth and inflate frames_unknown.
undocumented_passthrough:
  - { id: 0x023, rate_hz: 60, raw_sample: "1fd301e6c7675c17", likely_source: "BMW DME/DSC chassis bus passthrough" }
  - { id: 0x024, rate_hz: 60, raw_sample: "30020000ffff00d3", likely_source: "BMW DME/DSC chassis bus passthrough" }
  - { id: 0x028, rate_hz: 86, raw_sample: "02e6e8ffff",       likely_source: "BMW DME/DSC chassis bus passthrough" }
  - { id: 0x02F, rate_hz: 1,  raw_sample: "60964f00e2070100", likely_source: "BMW DME/DSC chassis bus passthrough" }
  - { id: 0x032, rate_hz: 1,  raw_sample: "645d1c00d43d6600", likely_source: "BMW DME/DSC chassis bus passthrough" }
  - { id: 0x043, rate_hz: 1,  raw_sample: "0000000000001c00", likely_source: "BMW DME/DSC chassis bus passthrough" }
  - { id: 0x044, rate_hz: 1,  raw_sample: "000000000000645d", likely_source: "BMW DME/DSC chassis bus passthrough" }
  - { id: 0x425, rate_hz: 16, raw_sample: "fecffecffecffecf", likely_source: "AiM MXP padding frame (all-0xCFFE sentinels)" }
  - { id: 0x42E, rate_hz: 3,  raw_sample: "0980551c00000000", likely_source: "AiM MXP undocumented status frame" }

# === 10. Signal post-processing pipelines ================================
#
# DBC signal name → transforms applied after cantools decodes the bytes.
#
#   apply:        in-place transforms; each item references a formula by
#                 name from data/formulas/standard.yaml.
#                 Shortcuts: `sign_flip: true` (= negate), `bias: <num>`.
#                 By default the formula's first input is bound to $self.
#   rename_to:    change the emitted name.
#   canonical:    also emit under the wide-row canonical name
#                 (speed_ms, g_lat, brake_bar, …).
#   derive:       emit additional named signals computed from this one
#                 (+ optional other signals via bind).
#
# Signals not listed here pass through untouched (emit as-is under the
# DBC name). Standard-stream `*_std` slots are not pipelined here — they
# carry padding only and should be ignored downstream.

signals:

  # ── 0x420 — engine + GPS speed + water temp (cosmetic) ─────────────────
  speed_mph:
    derive:
      - { name: speed_ms,  formula: mph_to_ms }
      - { name: speed_kmh, formula: linear, bind: { a: 1.609344, b: 0 } }

  water_temp_f:
    derive:
      - { name: water_temp_c, formula: f_to_c }

  # ── 0x423 — steer_angle_deg is the ONLY non-padding signal in std IMU ──
  steer_angle_deg:
    canonical: steering_deg
    # PDF §8.2: verify on first engine-running drive. Add sign_flip if reversed.

  # ── 0x424 — battery is the only non-padding signal in std msg5 ─────────
  # battery_volt: pass-through (no derive needed; emit as-is)

  # ── 0x450 — authoritative ECU#1 ────────────────────────────────────────
  rpm_ext:
    rename_to: rpm                        # bridge / coach prefer canonical name "rpm"
  speed_mph_ext:
    rename_to: ecu_speed_mph
    derive:
      - { name: ecu_speed_ms,  formula: mph_to_ms }
      - { name: ecu_speed_kmh, formula: linear, bind: { a: 1.609344, b: 0 } }
  water_temp_f_ext:
    rename_to: water_temp_f_auth          # avoid clashing with std mirror; emit *_auth
    derive:
      - { name: water_temp_c_auth, formula: f_to_c }
  # gear_ext is padding (0xCFFE) — ignore. Use methods.gear_position instead.

  # ── 0x451 — wheel speeds (BMW DSC) ─────────────────────────────────────
  wheel_speed_fl_mph:
    derive:
      - { name: wheel_speed_fl_ms,  formula: mph_to_ms }
      - { name: wheel_speed_fl_kmh, formula: linear, bind: { a: 1.609344, b: 0 } }
  wheel_speed_fr_mph:
    derive:
      - { name: wheel_speed_fr_ms,  formula: mph_to_ms }
      - { name: wheel_speed_fr_kmh, formula: linear, bind: { a: 1.609344, b: 0 } }
  wheel_speed_rl_mph:
    derive:
      - { name: wheel_speed_rl_ms,  formula: mph_to_ms }
      - { name: wheel_speed_rl_kmh, formula: linear, bind: { a: 1.609344, b: 0 } }
  wheel_speed_rr_mph:
    derive:
      - { name: wheel_speed_rr_ms,  formula: mph_to_ms }
      - { name: wheel_speed_rr_kmh, formula: linear, bind: { a: 1.609344, b: 0 } }

  # ── 0x452 — ECU#3 ──────────────────────────────────────────────────────
  engine_oil_temp_f:
    derive:
      - { name: engine_oil_temp_c, formula: f_to_c }
  ambient_temp_f:
    derive:
      - { name: ambient_temp_c, formula: f_to_c }
  steer_angle_deg_ext:
    # ECU's own steer angle reading — duplicates 0x423's value but at 10 Hz.
    # Don't canonicalise (steering_deg already comes from 0x423 at higher rate).
  pedal_pos_pct:
    canonical: throttle_pct

  # ── 0x453 — Status Flags ───────────────────────────────────────────────
  fuel_level_gal:
    derive:
      - { name: fuel_level_l, formula: gal_to_l }
  # abs_fail, dsc_reg, brake_switch: pass-through binary flags.

  # ── 0x454 — MIL ─────────────────────────────────────────────────────────
  # mil_chk_eng: pass-through bitfield (0=ok, non-zero=fault code present).

  # ── 0x455 — accelerometers (AUTHORITATIVE) ─────────────────────────────
  inline_accel_g:
    canonical: g_long
    # PDF §8.2: positive = acceleration. Live engine-off reads -0.30 g
    # (suspect — either downhill park OR sign inverted). Flip with
    # `apply: [{sign_flip: true}]` after first drive if needed.
  lateral_accel_g:
    canonical: g_lat
  vertical_accel_g:
    # Pass raw sensor sign through — the IMU's own convention (gravity
    # negative at rest) is the one we treat as authoritative for this car.
    # PDF §8.2's "+ = bump" convention is NOT applied; we keep the bus value.
    canonical: g_vert

  # ── 0x456 — gyroscopes (AUTHORITATIVE) ─────────────────────────────────
  # Sign convention verified on first drive — left as-is until then.
  # roll_rate_degs / pitch_rate_degs / yaw_rate_degs: pass-through.

  # ── 0x457 — analog 20 Hz (AUTHORITATIVE pressures) ─────────────────────
  oil_press_psi:
    derive:
      - { name: oil_press_bar, formula: psi_to_bar }
  water_press_psi_an:
    rename_to: water_press_psi
    derive:
      - { name: water_press_bar, formula: psi_to_bar }
  fuel_press_psi:
    derive:
      - { name: fuel_press_bar, formula: psi_to_bar }
  brake_press_psi:
    derive:
      - { name: brake_bar, formula: psi_to_bar }
    # canonical: not set — brake_bar (bar, different value) is the canonical name
    # via the derive above. The raw psi stays under brake_press_psi.

  # ── 0x458 — analog 1 Hz ────────────────────────────────────────────────
  oil_filter_temp_f:
    derive:
      - { name: oil_filter_temp_c, formula: f_to_c }
  # luminosity_pct, logger_temp_f: pass-through.

  # ── 0x459 — GPS lat/lon (AUTHORITATIVE) ────────────────────────────────
  gps_lat:
    canonical: lat
  gps_lon:
    canonical: lon
    # If raw == 0x7FFFFFFF / 1e-7 ≈ 214.7°, treat as no-fix sentinel downstream.

  # ── 0x45A/B/C/D — TPMS pass-through (pressure psi, temp F, voltage mV, alarm bitfield) ──
  tpms_press_fl_psi: { derive: [{ name: tpms_press_fl_bar, formula: psi_to_bar }] }
  tpms_press_fr_psi: { derive: [{ name: tpms_press_fr_bar, formula: psi_to_bar }] }
  tpms_press_rl_psi: { derive: [{ name: tpms_press_rl_bar, formula: psi_to_bar }] }
  tpms_press_rr_psi: { derive: [{ name: tpms_press_rr_bar, formula: psi_to_bar }] }
  tpms_temp_fl_f:    { derive: [{ name: tpms_temp_fl_c,    formula: f_to_c }] }
  tpms_temp_fr_f:    { derive: [{ name: tpms_temp_fr_c,    formula: f_to_c }] }
  tpms_temp_rl_f:    { derive: [{ name: tpms_temp_rl_c,    formula: f_to_c }] }
  tpms_temp_rr_f:    { derive: [{ name: tpms_temp_rr_c,    formula: f_to_c }] }
  # tpms_volt_* and tpms_alm_* pass-through.

  # ── 0x45E — GPS supplemental ──────────────────────────────────────────
  gps_speed_mph:
    derive:
      - { name: gps_speed_ms,  formula: mph_to_ms }
      - { name: gps_speed_kmh, formula: linear, bind: { a: 1.609344, b: 0 } }
  # gps_altitude_m, gps_pos_acc_mm, gps_speed_acc_mph: pass-through.


# === 11. Cross-signal derived =============================================
# Multi-input pure-arithmetic emissions. Evaluated after the frame's per-
# signal pipelines finish; inputs are read from the latest-value cache.

derived:
  combo_g:
    formula: combo_g
    bind:
      glat:  g_lat                        # canonical, set by lateral_accel_g
      glong: g_long                       # canonical, set by inline_accel_g

  total_g:
    formula: magnitude_3d
    bind: { x: g_lat, y: g_long, z: g_vert }
    notes: "True 3-axis accel magnitude including vertical bumps."

  wheel_speed_avg_mph:
    formula: mean_4
    bind:
      a: wheel_speed_fl_mph
      b: wheel_speed_fr_mph
      c: wheel_speed_rl_mph
      d: wheel_speed_rr_mph

  wheel_speed_front_avg_mph:
    formula: mean_2
    bind: { a: wheel_speed_fl_mph, b: wheel_speed_fr_mph }

  wheel_speed_rear_avg_mph:
    formula: mean_2
    bind: { a: wheel_speed_rl_mph, b: wheel_speed_rr_mph }

  tpms_press_avg_psi:
    formula: mean_4
    bind:
      a: tpms_press_fl_psi
      b: tpms_press_fr_psi
      c: tpms_press_rl_psi
      d: tpms_press_rr_psi

  tpms_temp_avg_f:
    formula: mean_4
    bind:
      a: tpms_temp_fl_f
      b: tpms_temp_fr_f
      c: tpms_temp_rl_f
      d: tpms_temp_rr_f


# === 12. Methods (non-arithmetic derivations) =============================
# For derivations that need lookup tables, hysteresis, or other non-pure
# logic. Handlers registered in code (car_config.METHOD_HANDLERS).

methods:
  gear_position:
    method: rpm_over_wheel_speed_ratio
    inputs: [rpm, wheel_speed_rl_mph, wheel_speed_rr_mph]
    ratios:                               # S54 ZF S6S420G
      "1": 4.227
      "2": 2.528
      "3": 1.669
      "4": 1.226
      "5": 1.000
      "6": 0.828
    final_drive: 3.62
    tire_circumference_m: 1.998           # 245/40 R18 rear, stock
    min_speed_kmh: 5.0
