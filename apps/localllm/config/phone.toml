# LocalLLM config — Pixel 10 / Termux deploy.
#
# Loaded by apps/localllm/service/localllm/run. The edge-daemon reads
# the same host:port via the PITWALL_ADK_OPENAI_URL env var.

[server]
host = "127.0.0.1"
port = 8080
log_level = "info"

[model]
# Local Gemma 4 E2B, 8-bit PTQ per PRD §3.2.
id = "gemma-4-e2b"
path = "~/llms/gemma-4-e2b-q8"
quantization = "int8"

[runtime]
# PRD §3.1 throughput target — fail-fast if startup measures below.
target_tokens_per_sec = 20
min_acceptable_tokens_per_sec = 15

# PRD §3.2 sector-slicing — clamp context window to a 3-second
# sliding telemetry window + the active corner-phase prompt block.
max_context_tokens = 1024
max_completion_tokens = 96

# PRD §3.1 CPU budget — keep CAN/GPS threads unencumbered.
cpu_thread_limit = 2

[delegate]
# Bind directly to AICore / LiteRT — bypass generic Android runtime.
prefer = "aicore"
fallback = "litert_gpu"
banned = ["cpu_fp32"]
