[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloud-backend"
version = "0.1.0"
description = "Trustable AI Super App — cloud backend (FastAPI + Vertex AI). Strategic reasoning, DEL synthesis, cold-path curriculum generation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "mlnomadpy" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "core-telemetry",
]

[project.optional-dependencies]
vertex = [
    # Vertex AI / Gemini 3.5 Pro client. Pin loosely so the platform team
    # can bump the SDK without coordinating with feature engineers.
    "google-cloud-aiplatform>=1.70",
    "google-genai>=0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
cloud-backend = "cloud_backend.main:run"

[tool.hatch.build.targets.wheel]
packages = ["cloud_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "--cov=cloud_backend --cov-report=term-missing --tb=short"
asyncio_mode = "auto"
