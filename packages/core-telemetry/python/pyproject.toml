[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "core-telemetry"
version = "0.1.0"
description = "Trustable AI Super App — shared telemetry schemas + DEL math contracts (Python)."
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "mlnomadpy" }]

dependencies = [
    "pydantic>=2.9",
    "jsonschema>=4.23",
    "numpy>=1.26",
]

[project.optional-dependencies]
can = [
    "python-can>=4.3",
    "cantools>=39.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["core_telemetry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "--cov=core_telemetry --tb=short"
